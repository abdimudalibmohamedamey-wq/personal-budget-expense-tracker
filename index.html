<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Budget Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Part 1 - Page structure -->
    <header>
        <h1>My Budget Tracker</h1>
        <p>Track your income and expenses in one place.</p>
    </header>        
    
     <main>
        <!-- Part 2 - The "Add Expense" section -->
        <section id="add-expense-section">
            <h2>Add Expense</h2>
            
            <!-- Input field for the expense name -->
            <label for="expense-name">Expense Name:</label>
            <input type="text" id="expense-name" placeholder="e.g., Groceries">

            <!-- Input field for the amount -->
            <label for="expense-amount">Amount:</label>
            <input type="number" id="expense-amount" placeholder="e.g., 50">

            <!-- Input field for the category -->
            <label for="expense-category">Category:</label>
            <select id="expense-category">
                <option value="">-- Select a Category --</option>
                <option value="food">Food</option>
                <option value="rent">Rent & Utilities</option>
                <option value="entertainment">Entertainment</option>
                <option value="transport">Transport</option>
            </select>
        </section>
        </section>
            <!-- Part 3 - The "Your Expenses" placeholder -->
    <section id="expenses-placeholder-section">
        <h2>Your Expenses</h2>
        <p class="placeholder-text">No expenses yet</p>
    </section>
 

</main>
</body>
